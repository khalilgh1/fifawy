name: fifawy
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "data/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#070706"
  adaptive_icon_foreground: "data/icon_nobg.png"
  web:
    generate: true
    image_path: "data/icon.png"

flutter:
  uses-material-design: true
  assets:
    - data/teams_offline.json
    - data/logos/
    - data/football_pitch_widget_loop.mp4
    - data/loading.mov
    - data/icon.png
    - data/icon_nobg.png
